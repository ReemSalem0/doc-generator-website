<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./css/index_style.css">
    <title>Homepage</title>
</head>

<body>
    <header class="top-bar">
        <h1>Logo + Name</h1>
        <div class="top-actions" hidden>
            <button type="button" id="editBtn">Edit</button>
            <button type="button" class="add-template-trigger">New Template</button>
        </div>
    </header>
    <main>
        <!-- New user-->
        <section id="emptyState" hidden>
            <button type="button" class="big-add-btn add-template-trigger">Add your first template</button>
        </section>

        <!--Returning user (there are templates already saved)-->
        <section id="templatesView" hidden>
            <div class="search">
                <form id="searchForm">
                    <input type="search" id="searchInput" placeholder="Search" name="search">
                    <button type="submit" aria-label="Search">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"
                            aria-hidden="true"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                            <path
                                d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z" />
                        </svg>
                    </button>
                </form>
            </div>
            <div class="templates-section">
                <h2>Templates</h2>
                <div class="edit-toolbar" hidden>
                    <button type="button" id="selectAllBtn">Select all</button>
                    <button type="button" id="deleteSelectedBtn">Delete</button>
                </div>
                <ul class="templates-list"></ul>
                <p class="no-results" hidden>No templates match your search</p>
                <template id="templateItem">
                    <li class="template-card">
                        <input type="checkbox" class="select-template edit-only">
                        <a class="template-link" href="#">
                            <div class="template-thumbnail" aria-hidden="true" inert></div>
                            <span class="template-name"></span>
                        </a>
                        <button type="button" class="remove-template-btn normal-only" aria-label="Delete template">
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"
                                aria-hidden="true"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                                <path
                                    d="M232.7 69.9C237.1 56.8 249.3 48 263.1 48L377 48C390.8 48 403 56.8 407.4 69.9L416 96L512 96C529.7 96 544 110.3 544 128C544 145.7 529.7 160 512 160L128 160C110.3 160 96 145.7 96 128C96 110.3 110.3 96 128 96L224 96L232.7 69.9zM128 208L512 208L512 512C512 547.3 483.3 576 448 576L192 576C156.7 576 128 547.3 128 512L128 208zM216 272C202.7 272 192 282.7 192 296L192 488C192 501.3 202.7 512 216 512C229.3 512 240 501.3 240 488L240 296C240 282.7 229.3 272 216 272zM320 272C306.7 272 296 282.7 296 296L296 488C296 501.3 306.7 512 320 512C333.3 512 344 501.3 344 488L344 296C344 282.7 333.3 272 320 272zM424 272C410.7 272 400 282.7 400 296L400 488C400 501.3 410.7 512 424 512C437.3 512 448 501.3 448 488L448 296C448 282.7 437.3 272 424 272z" />
                            </svg>
                        </button>
                        <button type="button" class="rename-template-btn edit-only" aria-label="Rename template">
                            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"
                                aria-hidden="true"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                                <path
                                    d="M100.4 417.2C104.5 402.6 112.2 389.3 123 378.5L304.2 197.3L338.1 163.4C354.7 180 389.4 214.7 442.1 267.4L476 301.3L442.1 335.2L260.9 516.4C250.2 527.1 236.8 534.9 222.2 539L94.4 574.6C86.1 576.9 77.1 574.6 71 568.4C64.9 562.2 62.6 553.3 64.9 545L100.4 417.2zM156 413.5C151.6 418.2 148.4 423.9 146.7 430.1L122.6 517L209.5 492.9C215.9 491.1 221.7 487.8 226.5 483.2L155.9 413.5zM510 267.4C493.4 250.8 458.7 216.1 406 163.4L372 129.5C398.5 103 413.4 88.1 416.9 84.6C430.4 71 448.8 63.4 468 63.4C487.2 63.4 505.6 71 519.1 84.6L554.8 120.3C568.4 133.9 576 152.3 576 171.4C576 190.5 568.4 209 554.8 222.5C551.3 226 536.4 240.9 509.9 267.4z" />
                            </svg>
                        </button>
                        <span class="drag-handle edit-only" aria-hidden="true"><svg class="icon"
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                                <path
                                    d="M96 160C96 142.3 110.3 128 128 128L512 128C529.7 128 544 142.3 544 160C544 177.7 529.7 192 512 192L128 192C110.3 192 96 177.7 96 160zM96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320zM544 480C544 497.7 529.7 512 512 512L128 512C110.3 512 96 497.7 96 480C96 462.3 110.3 448 128 448L512 448C529.7 448 544 462.3 544 480z" />
                            </svg>
                        </span>
                    </li>
                </template>

                <div class="add-template-btn">
                    <button type="button" class="add-template-trigger" aria-label="Add template">
                        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"
                            aria-hidden="true"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                            <path
                                d="M352 128C352 110.3 337.7 96 320 96C302.3 96 288 110.3 288 128L288 288L128 288C110.3 288 96 302.3 96 320C96 337.7 110.3 352 128 352L288 352L288 512C288 529.7 302.3 544 320 544C337.7 544 352 529.7 352 512L352 352L512 352C529.7 352 544 337.7 544 320C544 302.3 529.7 288 512 288L352 288L352 128z" />
                        </svg>
                    </button>
                </div>
            </div>
        </section>
        <input type="file" id="templateFileInput" hidden
            accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
    </main>
    <script type="module" src="./js/homepage.js"></script>
</body>

</html>
