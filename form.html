<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/form_style.css" />
    <title>Form</title>
  </head>
  <body>
    <h1>Logo + Name</h1>

    <div class="wrapper">
      <div class="formDiv">
        <h2 id="docTitle">Document Name</h2>
        <div id="formError" role="alert" hidden></div>

        <form class="docForm"></form>

        <template id="fieldTemplate">
          <div class="field">
            <label></label>
            <input />
          </div>
        </template>


      </div>

      <div class="btnOptions">
        <div class="dropdownBtn">
          <button class="saveBtn" disabled>Save</button>

          <div id="saveOptionsDropDown" class="dropdownContent">
            <button type="button" data-format="docx">Save as .docx</button>
            <button type="button" data-format="pdf">Save as .pdf</button>
          </div>
        </div>

        <button type="button" class="cancelBtn">Cancel</button>
        <button type="button" class="previewBtn" disabled>Preview</button>
      </div>
    </div>

     <dialog id="previewDialog">
      <button type="button" class="closePreviewBtn">&times;</button>
      <div id="preview"></div>
     </dialog>

    <script  type="module" src="./js/dropdownButtonController.js"></script>
    <script type="module" src="./js/formController.js"></script>
  </body>
</html>
